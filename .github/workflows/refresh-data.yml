name: Monthly Trade Data Refresh

on:
  schedule:
    # Runs on the 10th of every month at 13:00 UTC (after U.S. Census monthly trade release)
    - cron: '0 13 10 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch latest Census and UN ComTrade data
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          COMTRADE_API_KEY: ${{ secrets.COMTRADE_API_KEY }}
        run: npm run fetch-data

      - name: Run unit tests and build
        run: npm test && npm run build

      - name: Commit updated data shards if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet public/data/; then
            git add public/data/
            git commit -m "chore(data): monthly Census and UN ComTrade refresh ($(date -u +%Y-%m-%d))"
            git push origin HEAD:main
          else
            echo "No changes in public/data/ — skipping commit."
          fi

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy dist --project-name=trade-duess --branch=main
